<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>66大促 · 行业三部店播/K播监控看板</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #222536;
    --border: #2e3347;
    --red: #FF2D55;
    --orange: #FF9500;
    --green: #34C759;
    --blue: #0A84FF;
    --purple: #BF5AF2;
    --yellow: #FFD60A;
    --text: #e8eaf0;
    --text2: #8b8fa8;
    --text3: #5a5f75;
    --accent: #FF2D55;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    font-size: 13px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ===== Header ===== */
  .header {
    background: linear-gradient(135deg, #1a0a10 0%, #1a1020 40%, #0d1020 100%);
    border-bottom: 1px solid var(--border);
    padding: 18px 24px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .header-badge {
    background: linear-gradient(135deg, #FF2D55, #FF6B35);
    color: white;
    font-weight: 700;
    font-size: 15px;
    padding: 4px 12px;
    border-radius: 6px;
    letter-spacing: 1px;
  }
  .header-title { font-size: 16px; font-weight: 600; color: var(--text); }
  .header-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .update-time {
    font-size: 11px;
    color: var(--text3);
    background: var(--surface);
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
  }

  /* ===== Layout ===== */
  .main { padding: 20px 24px; max-width: 1600px; margin: 0 auto; }
  
  .section-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title::before {
    content: '';
    display: block;
    width: 3px;
    height: 16px;
    border-radius: 2px;
    background: var(--accent);
  }
  .section-badge {
    font-size: 11px;
    font-weight: 500;
    background: rgba(255,45,85,0.15);
    color: var(--accent);
    padding: 2px 8px;
    border-radius: 10px;
    border: 1px solid rgba(255,45,85,0.3);
  }

  /* ===== Tab Switcher ===== */
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 20px;
    width: fit-content;
  }
  .tab {
    padding: 7px 20px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: var(--text2);
    transition: all 0.2s;
    user-select: none;
  }
  .tab.active {
    background: var(--accent);
    color: white;
  }
  .tab:hover:not(.active) {
    background: var(--surface2);
    color: var(--text);
  }

  /* ===== Dept3 Summary Cards ===== */
  .dept3-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .tier-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    position: relative;
    overflow: hidden;
  }
  .tier-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    border-radius: 12px 12px 0 0;
  }
  .tier-card.t0::before { background: var(--blue); }
  .tier-card.t1::before { background: var(--green); }
  .tier-card.t2::before { background: var(--yellow); }
  .tier-card.t3::before { background: var(--orange); }
  .tier-card.t4::before { background: var(--red); }
  
  .tier-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text2);
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }
  .tier-type-label {
    font-size: 10px;
    color: var(--text3);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  .tier-nums {
    display: flex;
    align-items: baseline;
    gap: 4px;
    margin-bottom: 4px;
  }
  .tier-actual { font-size: 24px; font-weight: 700; color: var(--text); }
  .tier-target { font-size: 13px; color: var(--text3); }
  .tier-rate {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 10px;
  }
  .rate-high { background: rgba(52,199,89,0.15); color: var(--green); }
  .rate-mid { background: rgba(255,149,0,0.15); color: var(--orange); }
  .rate-low { background: rgba(255,45,85,0.12); color: var(--red); }
  .rate-zero { background: rgba(90,95,117,0.3); color: var(--text3); }

  .tier-divider {
    width: 100%;
    height: 1px;
    background: var(--border);
    margin: 8px 0;
  }

  /* Progress bar */
  .progress-wrap { margin-top: 6px; }
  .progress-bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.5s ease;
  }
  .t0 .progress-fill { background: var(--blue); }
  .t1 .progress-fill { background: var(--green); }
  .t2 .progress-fill { background: var(--yellow); }
  .t3 .progress-fill { background: var(--orange); }
  .t4 .progress-fill { background: var(--red); }

  /* ===== Industry Tables ===== */
  .industry-section { margin-bottom: 24px; }
  .industry-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 12px;
  }
  .industry-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .industry-card-header {
    background: var(--surface2);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }
  .industry-name {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
  }
  .industry-total {
    font-size: 11px;
    color: var(--text3);
  }
  .tier-row {
    display: grid;
    grid-template-columns: 80px 1fr 60px 60px 70px;
    gap: 6px;
    padding: 7px 14px;
    border-bottom: 1px solid rgba(46,51,71,0.5);
    align-items: center;
  }
  .tier-row:last-child { border-bottom: none; }
  .tier-row-header {
    display: grid;
    grid-template-columns: 80px 1fr 60px 60px 70px;
    gap: 6px;
    padding: 5px 14px 5px;
    border-bottom: 1px solid var(--border);
  }
  .tier-row-header span {
    font-size: 10px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-weight: 600;
  }
  .col-tier { font-size: 12px; color: var(--text2); font-weight: 500; }
  .col-bar { position: relative; }
  .col-target { font-size: 12px; color: var(--text3); text-align: right; }
  .col-actual { font-size: 13px; font-weight: 700; color: var(--text); text-align: right; }
  .col-rate { text-align: right; }
  .mini-bar {
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .mini-fill {
    height: 100%;
    border-radius: 3px;
    background: var(--blue);
  }
  .rate-pill {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 8px;
    display: inline-block;
  }

  /* ===== Tab panel ===== */
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ===== Note ===== */
  .note-bar {
    background: rgba(10,132,255,0.08);
    border: 1px solid rgba(10,132,255,0.2);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 11px;
    color: var(--text2);
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .note-icon { color: var(--blue); font-size: 14px; }

  /* ===== Responsive ===== */
  @media (max-width: 900px) {
    .dept3-grid { grid-template-columns: repeat(3, 1fr); }
    .industry-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 600px) {
    .dept3-grid { grid-template-columns: repeat(2, 1fr); }
    .main { padding: 14px; }
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>

const TIER_COLORS = ['#0A84FF','#34C759','#FFD60A','#FF9500','#FF2D55'];
const TIERS = ['5k-3w','3w-10w','10w-50w','50w-100w','100w+'];
const TIER_LABELS = ['5k～3万','3万～10万','10万～50万','50万～100万','100万+'];

function rateClass(rate) {
  if (rate === 0) return 'rate-zero';
  if (rate >= 50) return 'rate-high';
  if (rate >= 20) return 'rate-mid';
  return 'rate-low';
}

function rateText(rate) {
  if (rate === 0) return '0%';
  return rate + '%';
}

// ===== 行业三部汇总 =====
function renderDept3(elId, key) {
  const el = document.getElementById(elId);
  const d = DATA.dept3_summary[key];
  let html = '';
  TIERS.forEach((t, i) => {
    const target = d.target[t] || 0;
    const actual = d.actual[t] || 0;
    const rate = target > 0 ? Math.round(actual / target * 1000) / 10 : (actual > 0 ? 999 : 0);
    const pct = target > 0 ? Math.min(actual / target * 100, 100) : (actual > 0 ? 100 : 0);
    const rc = rateClass(rate);
    html += `
    <div class="tier-card t${i}">
      <div class="tier-label">${TIER_LABELS[i]}</div>
      <div class="tier-type-label">完成 / 目标</div>
      <div class="tier-nums">
        <span class="tier-actual">${actual}</span>
        <span class="tier-target">/ ${Math.round(target)}</span>
      </div>
      <span class="tier-rate ${rc}">${rate >= 999 ? '超额' : rateText(rate)}</span>
      <div class="progress-wrap">
        <div class="progress-bar">
          <div class="progress-fill" style="width:${pct}%"></div>
        </div>
      </div>
    </div>`;
  });
  el.innerHTML = html;
}

// ===== 各行业详情 =====
function renderIndustry(elId, rows) {
  const el = document.getElementById(elId);
  
  // 按行业分组
  const byIndustry = {};
  rows.forEach(r => {
    if (!byIndustry[r.industry]) byIndustry[r.industry] = [];
    byIndustry[r.industry].push(r);
  });

  let html = '';
  Object.entries(byIndustry).forEach(([ind, items]) => {
    const totalTarget = items.reduce((s, x) => s + x.target, 0);
    const totalActual = items.reduce((s, x) => s + x.actual, 0);
    const overallRate = totalTarget > 0 ? Math.round(totalActual / totalTarget * 1000) / 10 : 0;
    const maxTarget = Math.max(...items.map(x => x.target));

    html += `<div class="industry-card">
      <div class="industry-card-header">
        <div class="industry-name">${ind}</div>
        <div class="industry-total">合计 ${totalActual} / ${totalTarget} 场 · <span class="${rateClass(overallRate)}" style="font-size:11px;font-weight:700;">${rateText(overallRate)}</span></div>
      </div>
      <div class="tier-row-header">
        <span>层次</span>
        <span>进度</span>
        <span style="text-align:right">目标</span>
        <span style="text-align:right">完成</span>
        <span style="text-align:right">完成率</span>
      </div>`;
    
    items.forEach(item => {
      const pct = item.target > 0 ? Math.min(item.actual / item.target * 100, 100) : (item.actual > 0 ? 100 : 0);
      const rc = rateClass(item.rate);
      const color = pct >= 50 ? '#34C759' : pct >= 20 ? '#FF9500' : '#FF2D55';
      html += `<div class="tier-row">
        <div class="col-tier">${item.tier}</div>
        <div class="col-bar">
          <div class="mini-bar">
            <div class="mini-fill" style="width:${pct}%;background:${color}"></div>
          </div>
        </div>
        <div class="col-target">${item.target}</div>
        <div class="col-actual">${item.actual}</div>
        <div class="col-rate"><span class="rate-pill ${rc}">${rateText(item.rate)}</span></div>
      </div>`;
    });
    html += `</div>`;
  });
  el.innerHTML = html;
}

// ===== Tab 切换 =====
function switchTab(type) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && type === 'dbo') || (i === 1 && type === 'kbo'));
  });
  document.getElementById('panel-dbo').classList.toggle('active', type === 'dbo');
  document.getElementById('panel-kbo').classList.toggle('active', type === 'kbo');
}

// ===== 初始化 =====
renderDept3('dept3-dbo', 'dbo');
renderDept3('dept3-kbo', 'kbo');
renderIndustry('industry-dbo', DATA.dbo);
renderIndustry('industry-kbo', DATA.kbo);
